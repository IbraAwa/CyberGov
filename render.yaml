services:
  - type: web
    name: operation-el-jefe
    runtime: python
    plan: free               # gratuit : pas de disque, mise en veille apres ~15 min sans visite.
                             # La base SQLite (dans /tmp) est remise a zero a chaque redemarrage.
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DB_PATH
        value: /tmp/labo.db
      - key: PROF_PASSWORD
        sync: false          # saisi dans le dashboard Render, jamais dans le depot
