databases:
  - name: cybergov-db
    plan: free               # Render Postgres gratuit. ATTENTION : expire 30 jours apres sa creation
                             # (Render previent par e-mail). Recreer la base ou passer en payant avant.
    region: oregon           # meme region que le site
    databaseName: cybergov
    user: cybergov
    ipAllowList: []          # accessible uniquement depuis les services Render (pas depuis Internet)

services:
  - type: web
    name: operation-el-jefe
    runtime: python
    plan: free               # gratuit : mise en veille apres ~15 min sans visite (reveil ~1 min).
                             # Les donnees ne sont PAS sur le serveur mais dans cybergov-db :
                             # rien n'est perdu a la mise en veille ni aux redeploiements.
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cybergov-db
          property: connectionString
      - key: PROF_PASSWORD
        sync: false          # saisi dans le dashboard Render, jamais dans le depot
