services:
  - type: web
    name: operation-el-jefe
    runtime: python
    plan: free               # gratuit : PAS de disque. SQLite est ephemere (remis a zero
                             # a chaque redemarrage/mise en veille). Voir README.
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DB_PATH
        value: /tmp/labo.db
