<div class="sess-card" data-item>
  <a class="sc-open" href="{{ url_for('session_detail', sid=s.row['id']) }}">
    <span class="sc-tab"></span>
    <div class="sc-code">{{ s.row['code'] }}</div>
    <div class="sc-title">{{ s.row['title'] }}</div>
    {% if s.row['stacks'] %}<div class="sc-stacks">{{ s.row['stacks'] }}</div>{% endif %}
    <div class="sc-meta">{{ s.nb_agences }}/4 agences &middot; {{ s.nb_eleves }} eleves</div>
    <span class="sc-go">Ouvrir &rarr;</span>
  </a>
</div>
